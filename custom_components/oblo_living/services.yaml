set_property:
  name: Set OBLO property
  description: >-
    Write one property to the gateway and confirm it by reading the value
    back. Raises if the gateway accepts the command but the value does not
    change, so a successful call means the device actually moved.
  fields:
    device_id:
      name: Device ID
      description: OHM device id (the `id` field from the device list).
      required: true
      example: example-device-id
      selector:
        text:
    service_name:
      name: Service name
      description: Instance alias from OHM, e.g. `outlet0` or `basic0`.
      required: true
      example: outlet0
      selector:
        text:
    property_name:
      name: Property name
      description: Property to write, e.g. `State`.
      required: true
      example: State
      selector:
        text:
    property_value:
      name: Value
      description: Value to write. Relays take `1` (on) or `0` (off).
      required: true
      example: "1"
      selector:
        text:
    service_type:
      name: Service type
      description: >-
        Canonical OHM class, e.g. `OutletService`. Sent alongside the alias so
        the gateway can address the service by class.
      required: false
      example: OutletService
      selector:
        text:
    confirm_timeout:
      name: Confirmation timeout
      description: Seconds to keep reading back before the write is called unconfirmed.
      required: false
      default: 2.0
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: s
    entry_id:
      name: Config entry
      description: Only needed when more than one OBLO entry is loaded.
      required: false
      selector:
        text:

remove_device:
  name: Remove OBLO device
  description: >-
    Delete a device and all of its entities from Home Assistant. Pass either
    the HA device id (from the device page URL) or any entity_id that belongs
    to the device. Set `permanent` to also stop the integration from
    re-creating the device on the next restart.
  fields:
    device_id:
      name: HA device id
      description: The Home Assistant device registry id (device page URL).
      required: false
      example: 3f9c2a1b8e4d4f6c9a0b1c2d3e4f5a6b
      selector:
        text:
    entity_id:
      name: Entity
      description: >-
        Any entity belonging to the device. Used to resolve the device when
        you do not have its registry id.
      required: false
      example: sensor.living_room_weather_temperature
      selector:
        entity:
    permanent:
      name: Permanent
      description: >-
        Also add the device to the integration's ignore list so it is not
        re-created after a Home Assistant restart.
      required: false
      default: false
      selector:
        boolean:
    entry_id:
      name: Config entry
      description: Only needed when more than one OBLO entry is loaded.
      required: false
      selector:
        text:

get_property:
  name: Get OBLO property
  description: >-
    Read one property straight from the gateway, bypassing the cached
    coordinator state. Use it to check a write independently.
  fields:
    device_id:
      name: Device ID
      required: true
      example: example-device-id
      selector:
        text:
    service_name:
      name: Service name
      required: true
      example: outlet0
      selector:
        text:
    property_name:
      name: Property name
      required: true
      example: State
      selector:
        text:
    service_type:
      name: Service type
      required: false
      example: OutletService
      selector:
        text:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
